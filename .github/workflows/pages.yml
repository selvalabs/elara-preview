name: Publicar previa ELARA
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag anotada preview-* ja revisada e integrada a main
        required: true
        type: string
      release_sha:
        description: SHA completo aprovado da release neste repositorio
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(inputs.release_tag, 'preview-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout da release imutavel
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verificar identidade, historico e manifesto
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          git merge-base --is-ancestor HEAD origin/main
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('site').resolve()
          manifest = json.loads((root / 'build.json').read_text())
          assert manifest['dirty'] is False
          assert manifest['mode'] == 'preview'
          expected = set(manifest['files']) | {'build.json', '.nojekyll'}
          actual = {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()}
          assert actual == expected, 'Artefato contem arquivo ausente ou nao autorizado'
          assert not any(p.is_symlink() for p in root.rglob('*'))
          for relative, metadata in manifest['files'].items():
              target = (root / relative).resolve()
              assert target.is_relative_to(root)
              data = target.read_bytes()
              assert len(data) == metadata['bytes']
              assert hashlib.sha256(data).hexdigest() == metadata['sha256']
          print('Manifesto verificado; fonte:', manifest['commit'], 'arquivos:', len(actual))
          PY
          python3 scripts/verify-image-review.py
      - name: Configurar Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Empacotar somente arquivos do site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar artefato validado
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
